<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pokémon TCG Illustrator Checklist</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="header">
  <div class="header-inner">
    <div class="logo">
      <svg class="logo-icon" viewBox="0 0 36 36" fill="none" aria-label="Pokéball">
        <circle cx="18" cy="18" r="17" stroke="currentColor" stroke-width="2"/>
        <path d="M1 18h34" stroke="currentColor" stroke-width="2"/>
        <circle cx="18" cy="18" r="5" fill="currentColor"/>
        <circle cx="18" cy="18" r="3" fill="var(--color-surface-2)"/>
        <path d="M1 18C1 9.163 8.163 2 17 2" stroke="var(--color-primary)" stroke-width="2" stroke-linecap="round"/>
        <path d="M35 18C35 26.837 27.837 34 19 34" stroke="var(--color-primary)" stroke-width="2" stroke-linecap="round"/>
      </svg>
      <div class="logo-text">Illustrator<br><span>Checklist</span></div>
    </div>
    <div class="controls">
      <button class="theme-toggle" data-theme-toggle aria-label="Toggle theme">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
      </button>
    </div>
  </div>
</header>

<main class="grid-wrap">
  <h1 class="home-title">Choose an Illustrator</h1>
  <div class="illustrator-grid" id="illustratorGrid"></div>
</main>

<script src="illustrators.js"></script>
<script src="home.js"></script>
<script>
// Theme toggle (shared logic)
(function(){
  const t = document.querySelector('[data-theme-toggle]');
  const r = document.documentElement;
  let d = localStorage.getItem('yukaMoriiTheme') || (matchMedia('(prefers-color-scheme:dark)').matches ? 'dark' : 'light');
  r.setAttribute('data-theme', d);
  function updateIcon() {
    t.innerHTML = d === 'dark'
      ? '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>'
      : '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>';
  }
  updateIcon();
  if (t) t.addEventListener('click', () => {
    d = d === 'dark' ? 'light' : 'dark';
    r.setAttribute('data-theme', d);
    localStorage.setItem('yukaMoriiTheme', d);
    updateIcon();
  });
})();
</script>
</body>
</html>
