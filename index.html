<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yuka Morii Card Checklist</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root, [data-theme="light"] {
  --color-bg: #f4f2ef;
  --color-surface: #faf9f7;
  --color-surface-2: #ffffff;
  --color-surface-offset: #ece9e4;
  --color-divider: #ddd9d3;
  --color-border: #d0ccc5;
  --color-text: #28251d;
  --color-text-muted: #7a7974;
  --color-text-faint: #bab9b4;
  --color-primary: #e53935;
  --color-primary-hover: #c62828;
  --color-primary-highlight: #fde8e8;
  --color-obtained: #2e7d32;
  --color-obtained-hover: #1b5e20;
  --color-obtained-highlight: #e8f5e9;
  --color-accent: #1565c0;
  --shadow-sm: 0 1px 2px oklch(0.2 0.01 80 / 0.06);
  --shadow-md: 0 4px 12px oklch(0.2 0.01 80 / 0.10);
  --shadow-hover: 0 12px 32px oklch(0.2 0.01 80 / 0.18);
  --radius-sm: 0.375rem; --radius-md: 0.5rem; --radius-lg: 0.75rem;
  --radius-xl: 1rem; --radius-full: 9999px;
  --transition: 180ms cubic-bezier(0.16, 1, 0.3, 1);
  --text-xs: clamp(0.75rem, 0.7rem + 0.25vw, 0.875rem);
  --text-sm: clamp(0.875rem, 0.8rem + 0.35vw, 1rem);
  --text-base: clamp(1rem, 0.95rem + 0.25vw, 1.125rem);
  --text-lg: clamp(1.125rem, 1rem + 0.75vw, 1.5rem);
  --font-body: 'Nunito', 'Helvetica Neue', sans-serif;
  --space-1: 0.25rem; --space-2: 0.5rem; --space-3: 0.75rem; --space-4: 1rem;
  --space-5: 1.25rem; --space-6: 1.5rem; --space-8: 2rem; --space-12: 3rem;
}
[data-theme="dark"] {
  --color-bg: #171614; --color-surface: #1c1b19; --color-surface-2: #201f1d;
  --color-surface-offset: #22211f; --color-divider: #262523; --color-border: #393836;
  --color-text: #cdccca; --color-text-muted: #797876; --color-text-faint: #5a5957;
  --color-primary: #ef5350; --color-primary-hover: #e53935; --color-primary-highlight: #3b2222;
  --color-obtained: #66bb6a; --color-obtained-hover: #4caf50; --color-obtained-highlight: #1b3320;
  --color-accent: #5c9ce6;
  --shadow-sm: 0 1px 2px oklch(0 0 0 / 0.25);
  --shadow-md: 0 4px 12px oklch(0 0 0 / 0.35);
  --shadow-hover: 0 12px 32px oklch(0 0 0 / 0.55);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme]) {
  --color-bg: #171614; --color-surface: #1c1b19; --color-surface-2: #201f1d;
  --color-surface-offset: #22211f; --color-divider: #262523; --color-border: #393836;
  --color-text: #cdccca; --color-text-muted: #797876; --color-text-faint: #5a5957;
  --color-primary: #ef5350; --color-primary-hover: #e53935; --color-primary-highlight: #3b2222;
  --color-obtained: #66bb6a; --color-obtained-hover: #4caf50; --color-obtained-highlight: #1b3320;
  --color-accent: #5c9ce6;
  --shadow-sm: 0 1px 2px oklch(0 0 0 / 0.25);
  --shadow-md: 0 4px 12px oklch(0 0 0 / 0.35);
  --shadow-hover: 0 12px 32px oklch(0 0 0 / 0.55);
}}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-font-smoothing: antialiased; scroll-behavior: smooth; }
body { min-height: 100dvh; font-family: var(--font-body); font-size: var(--text-base); color: var(--color-text); background: var(--color-bg); }
img { display: block; max-width: 100%; height: auto; }
button { cursor: pointer; background: none; border: none; font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--color-primary); outline-offset: 3px; border-radius: var(--radius-sm); }

/* HEADER */
.header {
  position: sticky; top: 0; z-index: 100;
  background: var(--color-surface);
  border-bottom: 1px solid var(--color-divider);
  box-shadow: var(--shadow-sm);
  padding: var(--space-3) var(--space-6);
}
.header-inner { max-width: 1400px; margin: 0 auto; display: flex; align-items: center; gap: var(--space-4); flex-wrap: wrap; }
.logo { display: flex; align-items: center; gap: var(--space-3); flex-shrink: 0; }
.logo-icon { width: 36px; height: 36px; }
.logo-text { font-size: var(--text-lg); font-weight: 800; line-height: 1.1; color: var(--color-text); }
.logo-text span { color: var(--color-primary); }
.controls { display: flex; align-items: center; gap: var(--space-3); flex: 1; flex-wrap: wrap; }
.search-wrap { position: relative; flex: 1; min-width: 160px; }
.search-wrap svg { position: absolute; left: var(--space-3); top: 50%; transform: translateY(-50%); width: 16px; height: 16px; color: var(--color-text-muted); pointer-events: none; }
.search-input {
  width: 100%; padding: var(--space-2) var(--space-3) var(--space-2) calc(var(--space-3)*2 + 16px);
  background: var(--color-surface-offset); border: 1px solid var(--color-border);
  border-radius: var(--radius-full); font-size: var(--text-sm); color: var(--color-text); outline: none;
  transition: border-color var(--transition), box-shadow var(--transition);
}
.search-input::placeholder { color: var(--color-text-faint); }
.search-input:focus { border-color: var(--color-primary); box-shadow: 0 0 0 3px oklch(from var(--color-primary) l c h / 0.15); }

/* CONTROL ROW */
.control-row {
  display: flex; align-items: center; gap: var(--space-2); flex-wrap: wrap;
}
.ctrl-label { font-size: var(--text-xs); font-weight: 700; color: var(--color-text-muted); text-transform: uppercase; letter-spacing: 0.06em; flex-shrink: 0; }

.filter-btn, .sort-btn {
  padding: var(--space-1) var(--space-3);
  border-radius: var(--radius-full); font-size: var(--text-xs); font-weight: 700;
  border: 1.5px solid var(--color-border); background: var(--color-surface-offset);
  color: var(--color-text-muted); transition: all var(--transition); white-space: nowrap;
  display: flex; align-items: center; gap: var(--space-1);
}
.filter-btn:hover, .sort-btn:hover { border-color: var(--color-primary); color: var(--color-primary); background: var(--color-primary-highlight); }
.filter-btn.active { background: var(--color-primary); border-color: var(--color-primary); color: #fff; }
.sort-btn.active { background: var(--color-accent); border-color: var(--color-accent); color: #fff; }
.sort-btn .arrow { font-style: normal; font-size: 0.7em; }

.sep { width: 1px; height: 20px; background: var(--color-divider); flex-shrink: 0; }

.theme-toggle {
  width: 34px; height: 34px; display: flex; align-items: center; justify-content: center;
  border-radius: var(--radius-full); border: 1.5px solid var(--color-border);
  background: var(--color-surface-offset); color: var(--color-text-muted);
  transition: all var(--transition); flex-shrink: 0;
}
.theme-toggle:hover { border-color: var(--color-primary); color: var(--color-primary); }

/* STATS */
.stats-bar { max-width: 1400px; margin: 0 auto; padding: var(--space-3) var(--space-6); display: flex; align-items: center; gap: var(--space-4); flex-wrap: wrap; }
.stat-pill { display: flex; align-items: center; gap: var(--space-2); padding: var(--space-1) var(--space-3); background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-full); font-size: var(--text-xs); font-weight: 600; }
.stat-dot { width: 8px; height: 8px; border-radius: 50%; }
.stat-dot.total { background: var(--color-accent); }
.stat-dot.obtained { background: var(--color-obtained); }
.stat-dot.missing { background: var(--color-primary); }
.progress-bar-wrap { flex: 1; min-width: 100px; height: 6px; background: var(--color-surface-offset); border-radius: var(--radius-full); overflow: hidden; }
.progress-bar { height: 100%; background: var(--color-obtained); border-radius: var(--radius-full); transition: width 0.5s ease; }
.progress-text { font-size: var(--text-xs); color: var(--color-text-muted); font-weight: 700; }

/* GRID */
.grid-wrap { max-width: 1400px; margin: 0 auto; padding: var(--space-4) var(--space-6) var(--space-12); }
.card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(160px, 100%), 1fr)); gap: var(--space-4); }

/* YEAR SECTION HEADERS (for year sort) */
.year-header {
  grid-column: 1 / -1;
  display: flex; align-items: center; gap: var(--space-3);
  padding: var(--space-2) 0; margin-top: var(--space-2);
}
.year-header h2 {
  font-size: var(--text-sm); font-weight: 800; color: var(--color-text-muted);
  text-transform: uppercase; letter-spacing: 0.1em;
}
.year-header-line { flex: 1; height: 1px; background: var(--color-divider); }
.year-count { font-size: var(--text-xs); color: var(--color-text-faint); font-weight: 600; }

/* CARD */
.card-item {
  position: relative; border-radius: var(--radius-lg);
  background: var(--color-surface-2); border: 1.5px solid var(--color-border);
  box-shadow: var(--shadow-sm); overflow: hidden;
  transition: transform var(--transition), box-shadow var(--transition);
  cursor: pointer;
}
.card-item:hover { transform: translateY(-3px); box-shadow: var(--shadow-hover); }
.card-item.obtained { border-color: var(--color-obtained); }
.card-item.obtained .card-img-wrap::after {
  content: ""; position: absolute; inset: 0;
  background: oklch(from var(--color-obtained) l c h / 0.12);
  pointer-events: none;
}
.card-img-wrap { position: relative; width: 100%; aspect-ratio: 733/1024; overflow: hidden; background: var(--color-surface-offset); }
.card-img-wrap img { width: 100%; height: 100%; object-fit: cover; transition: transform var(--transition); }
.card-item:hover .card-img-wrap img { transform: scale(1.03); }
.obtained-badge {
  position: absolute; top: var(--space-2); right: var(--space-2); z-index: 2;
  width: 26px; height: 26px; border-radius: 50%;
  background: var(--color-obtained); color: #fff;
  display: flex; align-items: center; justify-content: center;
  box-shadow: var(--shadow-md); opacity: 0;
  transition: opacity var(--transition), transform var(--transition);
  transform: scale(0.6);
}
.card-item.obtained .obtained-badge { opacity: 1; transform: scale(1); }
.card-info { padding: var(--space-2) var(--space-3); }
.card-name { font-size: var(--text-sm); font-weight: 700; color: var(--color-text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card-set { font-size: var(--text-xs); color: var(--color-text-muted); font-weight: 500; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card-meta { font-size: var(--text-xs); color: var(--color-text-faint); font-weight: 600; margin-top: 1px; display: flex; justify-content: space-between; }

/* EMPTY */
.empty-state { grid-column: 1 / -1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: var(--space-12) var(--space-8); color: var(--color-text-muted); text-align: center; }
.empty-state svg { width: 48px; height: 48px; margin-bottom: var(--space-4); color: var(--color-text-faint); }
.empty-state h3 { font-size: var(--text-lg); font-weight: 700; color: var(--color-text); margin-bottom: var(--space-2); }

/* MOBILE */
@media (max-width: 600px) {
  .header { padding: var(--space-2) var(--space-3); }
  .header-inner { gap: var(--space-2); }
  .controls { gap: var(--space-2); }
  .stats-bar { padding: var(--space-2) var(--space-3); }
  .grid-wrap { padding: var(--space-3) var(--space-3) var(--space-12); }
  .card-grid { gap: var(--space-3); grid-template-columns: repeat(auto-fill, minmax(min(130px, 100%), 1fr)); }
  .sep { display: none; }
}
</style>
</head>

<header class="header">
  <div class="header-inner">
    <div class="logo">
      <svg class="logo-icon" viewBox="0 0 36 36" fill="none" aria-label="Pokéball">
        <circle cx="18" cy="18" r="17" stroke="currentColor" stroke-width="2"/>
        <path d="M1 18h34" stroke="currentColor" stroke-width="2"/>
        <circle cx="18" cy="18" r="5" fill="currentColor"/>
        <circle cx="18" cy="18" r="3" fill="var(--color-surface-2)"/>
        <path d="M1 18C1 9.163 8.163 2 17 2" stroke="var(--color-primary)" stroke-width="2" stroke-linecap="round"/>
        <path d="M35 18C35 26.837 27.837 34 19 34" stroke="var(--color-primary)" stroke-width="2" stroke-linecap="round"/>
      </svg>
      <div class="logo-text">Yuka Morii<br><span>Checklist</span></div>
    </div>
    <div class="controls">
      <div class="search-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        <input type="search" class="search-input" id="searchInput" placeholder="Search Pokémon or set…" aria-label="Search">
      </div>

      <div class="control-row">
        <span class="ctrl-label">Show</span>
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="missing">Missing</button>
        <button class="filter-btn" data-filter="obtained">Obtained</button>
      </div>

      <div class="sep" aria-hidden="true"></div>

      <div class="control-row">
        <span class="ctrl-label">Sort</span>
        <button class="sort-btn active" data-sort="name" title="Sort A→Z / Z→A">
          <span>Name</span><span class="arrow" id="arrow-name">↑</span>
        </button>
        <button class="sort-btn" data-sort="date" title="Sort oldest/newest">
          <span>Year</span><span class="arrow" id="arrow-date">↑</span>
        </button>
      </div>

      <button class="theme-toggle" data-theme-toggle aria-label="Toggle theme">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
      </button>
    </div>
  </div>
</header>

<div class="stats-bar" id="statsBar">
  <div class="stat-pill"><span class="stat-dot total"></span><span id="statTotal">0 total</span></div>
  <div class="stat-pill"><span class="stat-dot obtained"></span><span id="statObtained">0 obtained</span></div>
  <div class="stat-pill"><span class="stat-dot missing"></span><span id="statMissing">0 missing</span></div>
  <div class="progress-bar-wrap" role="progressbar" aria-label="Collection progress">
    <div class="progress-bar" id="progressBar" style="width:0%"></div>
  </div>
  <span class="progress-text" id="progressText">0%</span>
</div>

<main class="grid-wrap">
  <div class="card-grid" id="cardGrid" role="list" aria-label="Yuka Morii cards"></div>
</main>

"title": "Wormadam · Brilliant Stars (BRS) #010", "href": "https://pkmncards.com/card/wormadam-brilliant-stars-brs-010/", "img": "https://pkmncards.com/wp-content/uploads/en_US-SWSH9-010-wormadam-1.jpg", "release_date": "2022-02-25", "release_year": "2022", "page_order": 35}, {"id": "2798", "name": "Wurmple", "set": "Platinum", "set_code": "PL", "number": "103", "title": "Wurmple · Platinum (PL) #103", "href": "https://pkmncards.com/card/wurmple-platinum-pl-103/", "img": "https://pkmncards.com/wp-content/uploads/wurmple-platinum-pl-103.jpg", "release_date": "2009-02-11", "release_year": "2009", "page_order": 111}, {"id": "6325", "name": "Wynaut", "set": "Legend Maker", "set_code": "LM", "number": "71", "title": "Wynaut · Legend Maker (LM) #71", "href": "https://pkmncards.com/card/wynaut-legend-maker-lm-71/", "img": "https://pkmncards.com/wp-content/uploads/wynaut-legend-maker-lm-71.jpg", "release_date": "2006-02-13", "release_year": "2006", "page_order": 128}, {"id": "7291", "name": "Xatu", "set": "Deoxys", "set_code": "DX", "number": "29", "title": "Xatu · Deoxys (DX) #29", "href": "https://pkmncards.com/card/xatu-deoxys-dx-29/", "img": "https://pkmncards.com/wp-content/uploads/xatu-deoxys-dx-29.jpg", "release_date": "2005-02-14", "release_year": "2005", "page_order": 153}, {"id": "7075", "name": "Zigzagoon", "set": "Emerald", "set_code": "EM", "number": "74", "title": "Zigzagoon · Emerald (EM) #74", "href": "https://pkmncards.com/card/zigzagoon-emerald-em-74/", "img": "https://pkmncards.com/wp-content/uploads/zigzagoon-emerald-em-74.jpg", "release_date": "2005-05-09", "release_year": "2005", "page_order": 146}];

let obtained = {};
let filterMode = 'all';
let sortField = 'name';
let sortDir = { name: 1, date: 1 }; // 1 = asc, -1 = desc
let searchQuery = '';

try {
  const saved = localStorage.getItem('yukaMoriiObtained');
  if (saved) obtained = JSON.parse(saved);
} catch(e) {}

function saveState() {
  try { localStorage.setItem('yukaMoriiObtained', JSON.stringify(obtained)); } catch(e) {}
}

function toggleObtained(cardId) {
  if (obtained[cardId]) delete obtained[cardId];
  else obtained[cardId] = true;
  saveState();
  render();
}

function getFilteredSorted() {
  let list = CARDS.slice();

  // Search
  if (searchQuery) {
    const q = searchQuery.toLowerCase();
    list = list.filter(c =>
      c.name.toLowerCase().includes(q) ||
      c.set.toLowerCase().includes(q) ||
      c.set_code.toLowerCase().includes(q)
    );
  }

  // Filter
  if (filterMode === 'obtained') list = list.filter(c => obtained[c.id]);
  else if (filterMode === 'missing') list = list.filter(c => !obtained[c.id]);

  // Sort
  const dir = sortDir[sortField];
  list.sort((a, b) => {
    if (sortField === 'name') {
      const cmp = a.name.localeCompare(b.name);
      if (cmp !== 0) return cmp * dir;
      return a.release_date.localeCompare(b.release_date);
    } else { // date
      const cmp = a.release_date.localeCompare(b.release_date);
      if (cmp !== 0) return cmp * dir;
      return a.name.localeCompare(b.name);
    }
  });

  return list;
}

function updateStats() {
  const total = CARDS.length;
  const obtainedCount = Object.keys(obtained).length;
  const missing = total - obtainedCount;
  const pct = total > 0 ? Math.round((obtainedCount / total) * 100) : 0;
  document.getElementById('statTotal').textContent = total + ' total';
  document.getElementById('statObtained').textContent = obtainedCount + ' obtained';
  document.getElementById('statMissing').textContent = missing + ' missing';
  document.getElementById('progressBar').style.width = pct + '%';
  document.getElementById('progressText').textContent = pct + '%';
}

function makeCardEl(card) {
  const isObtained = !!obtained[card.id];
  const setLabel = card.set_code ? card.set + ' (' + card.set_code + ')' : card.set;
  const div = document.createElement('div');
  div.className = 'card-item' + (isObtained ? ' obtained' : '');
  div.dataset.id = card.id;
  div.setAttribute('role', 'listitem');
  div.setAttribute('tabindex', '0');
  div.setAttribute('title', (isObtained ? '✓ Obtained – click to unmark' : 'Click to mark as obtained'));
  div.innerHTML = `
    <div class="card-img-wrap">
      <img src="${card.img}" alt="${card.name} — ${card.set}" loading="lazy" width="160" height="224" decoding="async">
      <div class="obtained-badge" aria-hidden="true">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5"><polyline points="20 6 9 17 4 12"/></svg>
      </div>
    </div>
    <div class="card-info">
      <div class="card-name">${card.name}</div>
      <div class="card-set">${setLabel}</div>
      <div class="card-meta"><span>#${card.number}</span><span>${card.release_year}</span></div>
    </div>`;
  div.addEventListener('click', () => toggleObtained(div.dataset.id));
  div.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggleObtained(div.dataset.id); }});
  return div;
}

function render() {
  const grid = document.getElementById('cardGrid');
  const list = getFilteredSorted();
  updateStats();

  grid.innerHTML = '';

  if (list.length === 0) {
    grid.innerHTML = `<div class="empty-state">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <h3>No cards found</h3><p style="color:var(--color-text-muted);font-size:var(--text-sm)">Try a different search or filter.</p></div>`;
    return;
  }

  if (sortField === 'date') {
    // Group by year with section headers
    const groups = {};
    list.forEach(c => {
      const y = c.release_year;
      if (!groups[y]) groups[y] = [];
      groups[y].push(c);
    });
    const years = Object.keys(groups).sort((a, b) => sortDir.date * (a - b));
    years.forEach(year => {
      const header = document.createElement('div');
      header.className = 'year-header';
      header.innerHTML = `<h2>${year}</h2><div class="year-header-line"></div><span class="year-count">${groups[year].length} card${groups[year].length !== 1 ? 's' : ''}</span>`;
      grid.appendChild(header);
      groups[year].forEach(card => grid.appendChild(makeCardEl(card)));
    });
  } else {
    list.forEach(card => grid.appendChild(makeCardEl(card)));
  }
}

// Filter buttons
document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    filterMode = btn.dataset.filter;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    render();
  });
});

// Sort buttons
document.querySelectorAll('.sort-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const field = btn.dataset.sort;
    if (sortField === field) {
      sortDir[field] *= -1;
    } else {
      sortField = field;
    }
    // Update UI
    document.querySelectorAll('.sort-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    // Update arrows
    document.getElementById('arrow-name').textContent = sortDir.name === 1 ? '↑' : '↓';
    document.getElementById('arrow-date').textContent = sortDir.date === 1 ? '↑' : '↓';
    render();
  });
});

// Search
let searchTimeout;
document.getElementById('searchInput').addEventListener('input', e => {
  clearTimeout(searchTimeout);
  searchTimeout = setTimeout(() => { searchQuery = e.target.value.trim(); render(); }, 200);
});

// Theme toggle
(function(){
  const t = document.querySelector('[data-theme-toggle]');
  const r = document.documentElement;
  let d = matchMedia('(prefers-color-scheme:dark)').matches ? 'dark' : 'light';
  r.setAttribute('data-theme', d);
  function updateIcon() {
    t.innerHTML = d === 'dark'
      ? '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>'
      : '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>';
  }
  updateIcon();
  if (t) t.addEventListener('click', () => {
    d = d === 'dark' ? 'light' : 'dark';
    r.setAttribute('data-theme', d);
    updateIcon();
  });
})();

render();
</script>
